<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151b33"/>
      <stop offset="1" stop-color="#080a14"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf6ea"/>
      <stop offset="1" stop-color="#d9c9a6"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="600" cy="420" r="250" fill="#000"/>
    </mask>
    <clipPath id="above"><rect x="0" y="0" width="1024" height="700"/></clipPath>
  </defs>
  <rect x="40" y="40" width="944" height="944" rx="200" fill="url(#bg)"/>
  <g clip-path="url(#above)">
    <circle cx="512" cy="520" r="300" fill="url(#moon)" mask="url(#crescent)"/>
  </g>
  <rect x="200" y="712" width="624" height="22" rx="11" fill="#e6b877"/>
</svg>
